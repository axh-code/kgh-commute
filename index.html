<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SF commute board in a shoji frame: live trains, bikes, and the day's weather as the sky.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#a9794e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}</style>
<title>Bikes &amp; BART</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;600&display=swap">
<style>
  /* A shoji-screen panel floating in the day's sky. Single light world; the weather sets the background. */
  :root {
    --wood:   #a9794e;   /* cedar frame */
    --wood-d: #7c5733;   /* joinery shadow */
    --paper:  rgba(252, 249, 242, 0.82);  /* translucent washi — sky glows through */
    --paper-solid: #f7f2e8;
    --ink:    #2c2721;   /* sumi */
    --muted:  #756a5a;
    --hair:   #d8cdb8;
    --shu:    #bf4a2f;   /* vermilion — the Red Line / torii */
    --ebike:  #be7a2c;   /* kaki amber */
    --reg:    #3f5d6b;   /* ai indigo-slate */
    --live:   #5c8a53;
    --snap:   #b0863a;
    --sans: "Zen Kaku Gothic New", system-ui, -apple-system, sans-serif;
    --serif: "Zen Old Mincho", Georgia, "Times New Roman", serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--sans); color: var(--ink); background: #b9c0c2; -webkit-font-smoothing: antialiased; }

  /* ---- sky layers (fixed, behind everything) ---- */
  .sky, .sun, .clouds, #wxcanvas { position: fixed; inset: 0; pointer-events: none; }
  .sky { z-index: 0; transition: background 1.2s ease; background: linear-gradient(180deg, #aeb7ba 0%, #c9cfcd 55%, #bcc1be 100%); }
  .sun { z-index: 1; opacity: 0; transition: opacity 1.2s ease; background: radial-gradient(circle at 78% 20%, rgba(255,242,212,.95), rgba(255,242,212,0) 40%); }
  .clouds { z-index: 1; opacity: 0; transition: opacity 1.2s ease; overflow: hidden; }
  .cloud { position: absolute; background: radial-gradient(ellipse at center, rgba(255,255,255,.8), rgba(255,255,255,0) 70%); filter: blur(6px); will-change: transform; }
  .c1 { width: 46vmax; height: 20vmax; top: 10%; left: -30%; animation: drift 90s linear infinite; }
  .c2 { width: 60vmax; height: 24vmax; top: 24%; left: -40%; opacity: .8; animation: drift 130s linear infinite; animation-delay: -40s; }
  .c3 { width: 38vmax; height: 16vmax; top: 44%; left: -25%; opacity: .7; animation: drift 110s linear infinite; animation-delay: -80s; }
  @keyframes drift { to { transform: translateX(165vw); } }
  #wxcanvas { z-index: 2; }

  body[data-sky="clear"]  .sky { background: linear-gradient(180deg, #79abd6 0%, #b6d4e5 48%, #ecdcc0 100%); }
  body[data-sky="clear"]  .sun,
  body[data-sky="partly"] .sun { opacity: 1; }
  body[data-sky="partly"] .sky { background: linear-gradient(180deg, #8dbadf 0%, #c4d6df 55%, #dadcd5 100%); }
  body[data-sky="partly"] .clouds,
  body[data-sky="cloudy"] .clouds,
  body[data-sky="fog"]    .clouds { opacity: 1; }
  body[data-sky="cloudy"] .sky { background: linear-gradient(180deg, #a9b2b5 0%, #c7cdca 55%, #b9bebb 100%); }
  body[data-sky="fog"]    .sky { background: linear-gradient(180deg, #c0c5c3 0%, #d6d8d3 60%, #c6cac4 100%); }
  body[data-sky="rain"]   .sky { background: linear-gradient(180deg, #5f6d75 0%, #7d898d 55%, #8d9593 100%); }
  body[data-sky="storm"]  .sky { background: linear-gradient(180deg, #454e55 0%, #636b6e 55%, #6e7572 100%); }
  body[data-sky="snow"]   .sky { background: linear-gradient(180deg, #c2ccd1 0%, #dfe3e2 60%, #ced2cf 100%); }

  @media (prefers-reduced-motion: reduce) { .cloud { animation: none; } }

  /* ---- scene ---- */
  .scene {
    position: relative; z-index: 3; min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
    padding-block: 40px;
  }
  .banner { max-width: 440px; width: 100%; background: var(--paper-solid); border: 1px solid var(--wood-d); border-left: 4px solid var(--snap); padding: 10px 13px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .banner b { color: var(--ink); }
  .banner[hidden] { display: none; }

  /* ---- shoji frame ---- */
  .frame {
    width: 100%; max-width: 440px;
    background: var(--paper);
    -webkit-backdrop-filter: blur(9px) saturate(1.08);
    backdrop-filter: blur(9px) saturate(1.08);
    border: 11px solid var(--wood);
    box-shadow: inset 0 0 0 1px var(--wood-d), 0 26px 52px -20px rgba(34,24,12,.55);
    display: flex; flex-direction: column;
  }
  .pane { display: flex; flex-direction: column; }
  .pane + .pane { border-top: 5px solid var(--wood); }
  .pane-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; padding: 12px 14px 9px; }
  .pane-title { font-family: var(--serif); font-weight: 600; font-size: 16px; letter-spacing: .01em; }
  .pane-sub { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
  .mark { width: 9px; height: 9px; flex: none; align-self: center; }
  .mark.shu { background: var(--shu); }
  .mark.ebike { background: var(--ebike); }
  .mark.reg { background: var(--reg); }

  .cells { display: grid; }
  .c2 { grid-template-columns: 1fr 1fr; }
  .c3 { grid-template-columns: 1fr 1fr 1fr; }
  .cell { padding: 12px 14px 15px; min-width: 0; }
  .cell + .cell { border-left: 5px solid var(--wood); }

  /* weather cell */
  .wx-when { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .wx-row { display: flex; align-items: center; gap: 9px; margin-top: 5px; }
  .wx-ico { width: 30px; height: 30px; flex: none; display: block; }
  .wx-ico svg { width: 100%; height: 100%; display: block; }
  .wx-temp { font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .wx-desc { font-size: 12.5px; color: var(--muted); margin-top: 5px; }

  /* train cell */
  .train-cell { position: relative; }
  .train-cell.next { box-shadow: inset 0 4px 0 var(--shu); }
  .t-rank { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
  .train-cell.next .t-rank { color: var(--shu); }
  .t-min { font-size: 38px; font-weight: 700; line-height: .95; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .t-min.leaving { font-size: 22px; color: var(--shu); }
  .t-unit { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .t-meta { font-size: 10.5px; color: var(--muted); margin-top: 4px; min-height: 1em; }
  .t-meta .late { color: var(--shu); }
  .t-empty { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

  /* bike cell */
  .k { font-size: 11px; letter-spacing: .05em; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
  .num { font-size: 52px; font-weight: 700; line-height: .9; margin-top: 7px; font-variant-numeric: tabular-nums; }

  /* controls */
  .controls { max-width: 440px; width: 100%; display: flex; align-items: center; gap: 10px; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink); background: var(--paper-solid); border: 1px solid var(--wood-d); padding: 7px 10px; }
  .status .sq { width: 8px; height: 8px; background: var(--live); flex: none; }
  .status .sq.snap { background: var(--snap); }
  .status .sq.err { background: var(--shu); }
  .grow { flex: 1; }
  .btn { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink); background: var(--paper-solid); border: 1px solid var(--wood-d); padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
  .btn:hover { background: #fff; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--shu); outline-offset: 2px; }
  .btn svg { width: 14px; height: 14px; }
  .btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="sky"></div>
<div class="sun" id="sun"></div>
<div class="clouds" id="clouds"><span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span></div>
<canvas id="wxcanvas"></canvas>

<div class="scene">
  <div class="banner" id="sandboxBanner" hidden>
    <b>Preview note:</b> the claude.ai sandbox blocks outside data, so these are saved numbers &amp; a default sky. On pinyonstudio.com it's live.
  </div>

  <main class="frame">
    <section class="pane">
      <div class="pane-head"><span class="pane-title">San Francisco</span><span class="pane-sub">today · worst of 7a &amp; 4p</span></div>
      <div class="cells c2">
        <div class="cell" id="wx0"></div>
        <div class="cell" id="wx1"></div>
      </div>
    </section>

    <section class="pane">
      <div class="pane-head"><span class="mark shu"></span><span class="pane-title">Red Line · Eastbound</span><span class="pane-sub">Montgomery → Richmond</span></div>
      <div class="cells c3" id="trains"></div>
    </section>

    <section class="pane">
      <div class="pane-head"><span class="pane-title">18th Ave at California</span><span class="pane-sub">Bay Wheels</span></div>
      <div class="cells c2">
        <div class="cell"><div class="k"><span class="mark ebike"></span>E-bikes</div><div class="num" id="ebikeBig">–</div></div>
        <div class="cell"><div class="k"><span class="mark reg"></span>Regular</div><div class="num" id="classicBig">–</div></div>
      </div>
    </section>
  </main>

  <div class="controls">
    <span class="status"><span class="sq" id="statusSq"></span><span id="statusText">live</span></span>
    <span class="grow"></span>
    <a class="btn" href="https://maps.google.com/?q=37.785111,-122.477667" target="_blank" rel="noopener">Dock in Maps</a>
    <button class="btn" id="refreshBtn" aria-label="Refresh now">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      Refresh
    </button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var BART_KEY = "MW9S-E7SL-26DU-VV8V";
  var BART_URL = "https://api.bart.gov/api/etd.aspx?cmd=etd&orig=MONT&key=" + BART_KEY + "&json=y";
  var BART_LINE = "RED", BART_DIR = "North";
  var STATION_ID = "37cf6b02-5cb0-4461-bf45-0ae60a1a2fb7";
  var STATUS_URL = "https://gbfs.lyft.com/gbfs/1.1/bay/en/station_status.json";
  var WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=37.7749&longitude=-122.4194&hourly=temperature_2m,weather_code,precipitation_probability&temperature_unit=fahrenheit&timezone=America/Los_Angeles&forecast_days=1";
  var REFRESH_MS = 45000;

  var BART_FALLBACK = { trains: [ {min:1,len:10,delay:0}, {min:21,len:10,delay:0}, {min:41,len:10,delay:0} ] };
  var BIKE_FALLBACK = { num_bikes_available: 7, num_ebikes_available: 2, last_reported: 1792438200 };
  var WX_FALLBACK = { slots: [ {temp:55,code:3,precip:0}, {temp:62,code:3,precip:0} ] };

  var bikeReportedTs = null, sandboxFlagged = false, firstLoad = true, liveOk = true;
  var $ = function (id) { return document.getElementById(id); };
  function fmtAgo(sec){ if(sec==null)return""; var s=Math.max(0,Math.floor(sec)); if(s<60)return s+"s ago"; var m=Math.floor(s/60); if(m<60)return m+" min ago"; return Math.floor(m/60)+"h ago"; }
  function flagSandbox(){ if(!sandboxFlagged){ sandboxFlagged=true; $("sandboxBanner").hidden=false; } }
  function setStatus(kind, text){ var sq=$("statusSq"); sq.className="sq"+(kind==="snap"?" snap":kind==="err"?" err":""); $("statusText").textContent=text; }

  /* ---- weather classification ---- */
  function wxInfo(code){
    if(code<=1) return {sky:"clear",  sev:0, label: code===0?"Clear":"Mostly clear"};
    if(code===2) return {sky:"partly", sev:1, label:"Partly cloudy"};
    if(code===3) return {sky:"cloudy", sev:2, label:"Overcast"};
    if(code===45||code===48) return {sky:"fog", sev:3, label:"Fog"};
    if((code>=71&&code<=77)||code===85||code===86) return {sky:"snow", sev:4, label:"Snow"};
    if(code>=95) return {sky:"storm", sev:5, label:"Storms"};
    if(code>=51) return {sky:"rain", sev:4, label: code>=80?"Showers":"Rain"};
    return {sky:"cloudy", sev:2, label:"Cloudy"};
  }
  var WX_ICONS = {
    clear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>',
    partly:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 1.6v1.3M2.6 7.5H1.3M4.1 3.6 3.2 2.7M12.8 3.6l.9-.9"/><path d="M7 20h9a3.5 3.5 0 0 0 .3-7A4.5 4.5 0 0 0 8 11.3 3.6 3.6 0 0 0 7 20z"/></svg>',
    cloudy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h9a4 4 0 0 0 .4-8A5 5 0 0 0 7 8.5 3.8 3.8 0 0 0 7 18z"/></svg>',
    fog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5h11a3.4 3.4 0 0 0 .3-6.8A4.8 4.8 0 0 0 7.5 4.6"/><path d="M4 16.5h13M6 20.5h10"/></svg>',
    rain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h9a4 4 0 0 0 .4-8A5 5 0 0 0 7 5.5 3.8 3.8 0 0 0 7 15z"/><path d="M8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/></svg>',
    snow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h9a4 4 0 0 0 .4-8A5 5 0 0 0 7 5.5 3.8 3.8 0 0 0 7 15z"/><path d="M9 19h.01M12 20.5h.01M15 19h.01"/></svg>',
    storm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h9a4 4 0 0 0 .4-8A5 5 0 0 0 7 4.5 3.8 3.8 0 0 0 7 14z"/><path d="M12 15l-2 3.5h3L11 22"/></svg>'
  };
  var WX_TINT = { clear:"#c6974a", partly:"#c6974a", cloudy:"var(--muted)", fog:"var(--muted)", rain:"var(--reg)", snow:"var(--reg)", storm:"#8a6d3a" };
  var WX_WHEN = ["7 AM", "4 PM"];

  function renderWeather(slots, source){
    var worst = null;
    slots.forEach(function(s,i){
      var info = wxInfo(s.code);
      if(!worst || info.sev > worst.sev) worst = info;
      var precip = (s.precip!=null && s.precip>=20) ? " · "+s.precip+"% rain" : "";
      $("wx"+i).innerHTML =
        '<div class="wx-when">'+WX_WHEN[i]+'</div>'+
        '<div class="wx-row"><span class="wx-ico" style="color:'+(WX_TINT[info.sky]||"var(--ink)")+'">'+WX_ICONS[info.sky]+'</span>'+
        '<span class="wx-temp">'+Math.round(s.temp)+'°</span></div>'+
        '<div class="wx-desc">'+info.label+precip+'</div>';
    });
    if(worst) setSky(worst.sky);
  }
  function loadWeather(){
    return fetch(WX_URL,{cache:"no-store"}).then(function(r){ if(!r.ok)throw new Error(r.status); return r.json(); })
      .then(function(j){
        var h=j.hourly, t=h.time, slots=[];
        ["07:00","16:00"].forEach(function(hh){
          for(var i=0;i<t.length;i++){ if(t[i].slice(11,16)===hh){ slots.push({temp:h.temperature_2m[i], code:h.weather_code[i], precip:h.precipitation_probability?h.precipitation_probability[i]:null}); break; } }
        });
        if(slots.length<2) throw new Error("hours");
        renderWeather(slots,"live"); return true;
      });
  }

  /* ---- sky + weather motion ---- */
  var canvas, ctx, W, H, DPR, mode="none", parts=[], raf=null;
  var reduced = (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  function sizeCanvas(){ DPR=Math.min(window.devicePixelRatio||1,2); W=canvas.width=Math.floor(innerWidth*DPR); H=canvas.height=Math.floor(innerHeight*DPR); canvas.style.width=innerWidth+"px"; canvas.style.height=innerHeight+"px"; }
  function seed(){
    parts=[]; var n=0, i;
    if(mode==="rain"||mode==="storm"){ n = mode==="storm"?220:130; for(i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,l:(10+Math.random()*14)*DPR,s:(6+Math.random()*5)*DPR}); }
    else if(mode==="snow"){ n=80; for(i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,r:(1.2+Math.random()*1.8)*DPR,s:(.6+Math.random()*1)*DPR,drift:Math.random()*Math.PI*2}); }
    else if(mode==="clear"){ n=16; for(i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,r:(1+Math.random()*1.6)*DPR,s:(.15+Math.random()*.3)*DPR,drift:Math.random()*Math.PI*2}); }
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    var i,p;
    if(mode==="rain"||mode==="storm"){
      ctx.strokeStyle="rgba(228,236,238,.34)"; ctx.lineWidth=DPR;
      for(i=0;i<parts.length;i++){ p=parts[i]; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+p.l*.28,p.y+p.l); ctx.stroke(); p.y+=p.s; p.x+=p.s*.28; if(p.y>H){ p.y=-p.l; p.x=Math.random()*W; } }
    } else if(mode==="snow"){
      ctx.fillStyle="rgba(255,255,255,.85)";
      for(i=0;i<parts.length;i++){ p=parts[i]; p.drift+=.01; ctx.beginPath(); ctx.arc(p.x+Math.sin(p.drift)*6*DPR,p.y,p.r,0,6.3); ctx.fill(); p.y+=p.s; if(p.y>H){ p.y=-4*DPR; p.x=Math.random()*W; } }
    } else if(mode==="clear"){
      ctx.fillStyle="rgba(255,246,222,.5)";
      for(i=0;i<parts.length;i++){ p=parts[i]; p.drift+=.005; ctx.beginPath(); ctx.arc(p.x+Math.sin(p.drift)*10*DPR,p.y,p.r,0,6.3); ctx.fill(); p.y-=p.s; if(p.y<-4*DPR){ p.y=H+4*DPR; p.x=Math.random()*W; } }
    }
    raf=requestAnimationFrame(frame);
  }
  function setMotion(m){
    if(reduced){ if(raf){cancelAnimationFrame(raf);raf=null;} if(ctx)ctx.clearRect(0,0,W,H); return; }
    mode=m; seed();
    if(m==="none"||m==="partly"||m==="cloudy"||m==="fog"){ if(raf){cancelAnimationFrame(raf);raf=null;} ctx.clearRect(0,0,W,H); return; }
    if(!raf) frame();
  }
  function setSky(bucket){
    document.body.dataset.sky = bucket;
    setMotion(bucket);
  }

  /* ---- BART ---- */
  function renderTrains(mins, delays, lens, source, apiTime){
    var box=$("trains"); box.innerHTML="";
    var ranks=["Next","Then","After"];
    if(!mins.length){
      box.innerHTML='<div class="cell train-cell"><div class="t-rank">Red Line</div><div class="t-empty">No eastbound trains right now — try the Orange Line.</div></div>';
    } else {
      for(var i=0;i<Math.min(3,mins.length);i++){
        var m=mins[i], leaving=(m===0);
        var late = delays && delays[i]>=60 ? Math.round(delays[i]/60) : 0;
        var el=document.createElement("div");
        el.className="cell train-cell"+(i===0?" next":"");
        el.innerHTML='<div class="t-rank">'+ranks[i]+'</div>'+
          (leaving?'<div class="t-min leaving">Leaving</div>':'<div class="t-min">'+m+'<span class="t-unit">min</span></div>')+
          '<div class="t-meta">'+(lens&&lens[i]?lens[i]+'-car':'')+(late?' · <span class="late">'+late+' late</span>':'')+'</div>';
        box.appendChild(el);
      }
    }
  }
  function loadBart(){
    return fetch(BART_URL,{cache:"no-store"}).then(function(r){ if(!r.ok)throw new Error(r.status); return r.json(); })
      .then(function(j){
        var root=j.root||{}, station=(root.station||[])[0];
        if(!station) throw new Error("no station");
        var mins=[],delays=[],lens=[];
        (station.etd||[]).forEach(function(dest){ (dest.estimate||[]).forEach(function(e){
          if((e.color||"").toUpperCase()===BART_LINE && e.direction===BART_DIR){
            var m=(e.minutes==="Leaving")?0:parseInt(e.minutes,10);
            if(!isNaN(m)){ mins.push(m); delays.push(parseInt(e.delay||"0",10)||0); lens.push(e.length); }
          }
        }); });
        var ord=mins.map(function(m,i){return i;}).sort(function(a,b){return mins[a]-mins[b];});
        renderTrains(ord.map(function(i){return mins[i];}),ord.map(function(i){return delays[i];}),ord.map(function(i){return lens[i];}),"live",root.time||"");
        return true;
      });
  }
  function bartFallback(){ renderTrains(BART_FALLBACK.trains.map(function(t){return t.min;}),BART_FALLBACK.trains.map(function(t){return t.delay;}),BART_FALLBACK.trains.map(function(t){return t.len;}),"fallback",""); }

  /* ---- BIKES ---- */
  function renderBikes(d){
    var ebike=d.num_ebikes_available||0;
    var classic=Math.max(0,(d.num_bikes_available||0)-ebike);
    $("ebikeBig").textContent=ebike;
    $("classicBig").textContent=classic;
    bikeReportedTs=d.last_reported||null;
  }
  function loadBikes(){
    return fetch(STATUS_URL,{cache:"no-store"}).then(function(r){ if(!r.ok)throw new Error(r.status); return r.json(); })
      .then(function(j){
        var st=(j.data.stations||[]).filter(function(s){return s.station_id===STATION_ID;})[0];
        if(!st) throw new Error("missing");
        renderBikes(st); return true;
      });
  }

  /* ---- orchestration ---- */
  function updateStatus(){
    if(!liveOk){ setStatus("snap","saved snapshot"); return; }
    var ago = bikeReportedTs!=null ? (Date.now()/1000 - bikeReportedTs) : null;
    setStatus("live", ago!=null ? "live · "+fmtAgo(ago) : "live");
  }
  function refresh(manual){
    var btn=$("refreshBtn");
    if(manual){ btn.classList.add("spin"); btn.disabled=true; }
    var wasFirst=firstLoad; firstLoad=false;
    var ok=true;

    loadWeather().catch(function(){ if(wasFirst){ renderWeather(WX_FALLBACK.slots,"fallback"); } ok=false; });
    loadBart().catch(function(){ if(wasFirst){ bartFallback(); } ok=false; });
    loadBikes().catch(function(){ if(wasFirst){ renderBikes(BIKE_FALLBACK); } ok=false; })
      .then(function(){
        liveOk = ok;
        if(!ok && wasFirst) flagSandbox();
        updateStatus();
        if(manual) setTimeout(function(){ btn.classList.remove("spin"); btn.disabled=false; }, 450);
      });
  }

  // init
  canvas=$("wxcanvas"); ctx=canvas.getContext("2d"); sizeCanvas();
  var rsz; window.addEventListener("resize", function(){ clearTimeout(rsz); rsz=setTimeout(function(){ sizeCanvas(); seed(); }, 200); });
  $("refreshBtn").addEventListener("click", function(){ refresh(true); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) refresh(false); });
  setInterval(updateStatus, 1000);
  setInterval(function(){ if(!document.hidden) refresh(false); }, REFRESH_MS);
  refresh(false);
})();
</script>
</body>
</html>
